name: loob
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.0
  firebase_messaging: ^15.0.0
  cloud_functions: ^5.1.0
  get: ^4.6.6
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  flutter_stripe: ^11.0.0
  intl: ^0.19.0
  uuid: ^4.4.0
  http: ^1.2.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  share_plus: ^12.0.2
  path_provider: ^2.1.3
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/loob_app.png
    - assets/loob_app_1.png
    - assets/icon/loob_app.png
    - assets/icon/loob_app_1.png
    - assets/images/loob_logo.png
    - .env
    - .env.example

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/loob_app_1.png"
